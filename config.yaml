# Правила чистки площадок. Все пороги можно менять здесь, код трогать не нужно.

period:
  # За сколько дней собирать статистику.
  # 90 дней — потому что в РСЯ трафик по одной площадке набегает медленно,
  # и на 30 днях большинство площадок просто не наберут значимой выборки.
  days: 90

economics:
  # Целевая стоимость конверсии в рублях. ГЛАВНАЯ настройка.
  # Если оставить null — за эталон берётся средний CPA по аккаунту,
  # но учти: если текущий CPA уже плохой, ассистент будет мягок к мусору.
  target_cpa: null

  # Учитывать НДС в расходах.
  include_vat: true

# Порог достоверности: ниже этих значений площадка не судится вообще.
# Отключать площадку по трём кликам без конверсии — это отключать шум,
# а не мусор. Такие площадки уходят в категорию "под наблюдением".
significance:
  min_impressions: 100
  min_clicks: 10
  # Либо потрачено хотя бы столько целевых CPA — тогда выборки достаточно
  # даже при малом числе кликов.
  min_spend_in_cpa: 2.0

rules:
  # Слив: потрачено >= N целевых CPA, конверсий ноль.
  zero_conversion_spend_in_cpa: 2.0

  # CPA хуже среднего по аккаунту более чем в N раз.
  cpa_worse_than_avg_ratio: 2.0

  # Отказы выше N% при достаточном числе визитов.
  bounce_rate_max: 70.0
  bounce_rate_min_visits: 30

  # CTR аномально низкий: меньше N% от среднего по аккаунту.
  ctr_below_avg_share: 0.3

  # CTR аномально высокий при нулевых конверсиях — признак накрутки.
  ctr_above_avg_ratio: 5.0

  # Мобильные приложения с нулевой конверсией — частый источник мискликов.
  flag_zero_conversion_apps: true

  # Сколько правил должно совпасть, чтобы отправить площадку в запрет.
  min_triggers_to_block: 2

safety:
  # Не отключать за один заход больше этой доли площадок.
  max_block_share_per_run: 0.25

  # Жёсткий лимит Директа: 1000 запрещённых доменов на кампанию
  # (100 для видео). Оставляем запас.
  max_excluded_per_campaign: 900

  # Никогда не трогать площадки, на которых есть хотя бы одна конверсия,
  # даже если CPA высокий. Такие лучше ограничивать ставкой, а не запретом.
  never_block_with_conversions: true

  # Кампании, которые не трогаем ни при каких условиях (ID или часть названия).
  excluded_campaigns: []

  # Площадки, которые не трогаем никогда (белый список).
  whitelist: []
